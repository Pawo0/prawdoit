<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f3eb"><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js"></script><title>Prawdowid — wynik sprawdzenia</title></head><body class="analysis-page">
<main class="wrap">
  <h1>Wynik sprawdzenia</h1>
  <div id="out" tabindex="-1"><p class="muted" role="status">Wczytujemy wynik…</p></div>
  <div class="row"><a class="btn secondary" href="/">Sprawdź coś innego</a><button class="secondary" id="share" type="button">Kopiuj link do wyniku</button></div>
</main>
<script>
// Explanation page: /analiza/<id> (saved result) or /sprawdz#t=<text> (fresh check, e.g. from the extension).
const out = document.getElementById("out");
async function main() {
  const m = location.pathname.match(/^\/analiza\/([a-f0-9]+)/);
  let wait = null;
  try {
    let res;
    if (m) {
      const r = await fetch("/api/check/" + m[1]);
      if (!r.ok) throw new Error(await errDetail(r));
      res = await r.json();
    } else {
      const t = decodeURIComponent((location.hash.match(/t=(.*)$/) || [])[1] || "");
      if (!t) { location.href = "/"; return; }
      wait = openWait({inline: out});  // "Sprawdzanie informacji" window with the live stage and "Anuluj"
      res = await checkWithProgress(t, new URLSearchParams(location.search).get("ch") || "web", wait);
      history.replaceState(null, "", "/analiza/" + res.id);
    }
    renderResult(res, out, {full: true});
    if (!m) out.focus();
  } catch (e) { renderTechError(out, e); }
  finally { wait?.close(); }
}
document.getElementById("share").onclick = async () => { try { await navigator.clipboard.writeText(location.href); document.getElementById("share").textContent = "Link skopiowany"; } catch { document.getElementById("share").textContent = "Skopiuj adres z paska przeglądarki"; } };
main();
</script></body></html>
